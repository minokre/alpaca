name: Windows build

on:
  workflow_dispatch:
  push:
    branches: '**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: 1

      - name: Build Windows executable
        run: go build -trimpath -o dist/alpaca.exe -ldflags="-s -w -X 'main.BuildVersion=${{ github.sha }}'" .
        env:
          CGO_ENABLED: 1

      - name: Show version
        run: .\dist\alpaca.exe -version

      - uses: actions/upload-artifact@v7
        with:
          name: alpaca-windows-amd64
          path: dist/alpaca.exe
          if-no-files-found: error
